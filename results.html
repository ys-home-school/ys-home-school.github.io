<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Worksheet - Ys Learning Lab</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6130154285914649" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="assets/YsSchool.png" />
<link rel="stylesheet" href="assets/css/site.css?v=7" />
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

<header class="site-header sticky top-0 z-10">
  <nav class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
    <a href="index.html" class="flex items-center gap-2 text-xl font-extrabold text-stone-800">
      <img src="assets/YsSchool.png" alt="Ys Learning Lab logo" class="w-9 h-9 object-contain" /> Learning Lab
    </a>
    <div class="flex items-center gap-2 text-sm">
      <a href="math.html" class="nav-key">Math</a>
      <a href="japanese.html" class="nav-key">Japanese</a>
    </div>
  </nav>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-4">

  <!-- EMPTY / EXPIRED STATE -->
  <div id="empty-state" class="hidden text-center py-24">
    <div class="text-3xl mb-3">📄</div>
    <h1 class="text-xl font-bold mb-2">Nothing to show here</h1>
    <p class="text-sm text-stone-600 mb-6">This link has expired or no worksheet was handed off. Go back and generate one.</p>
    <a href="index.html" class="btn-key btn-key-primary inline-block px-4 py-2 text-sm">Back to Ys Learning Lab</a>
  </div>

  <!-- VIEWER -->
  <div id="viewer-shell" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <a id="back-link" href="index.html" class="text-sm font-semibold text-indigo-700 hover:underline">&larr; Back</a>
    </div>

    <div class="flex flex-col md:grid md:grid-cols-[110px_1fr_300px] gap-4 items-start">

      <!-- THUMBNAIL RAIL -->
      <div id="thumbs-container" class="order-3 md:order-1 hidden md:flex md:flex-col md:overflow-y-auto md:max-h-[75vh] w-full"></div>

      <!-- CENTER VIEWER -->
      <div class="order-1 md:order-2 w-full card-soft overflow-hidden">
        <div class="bg-stone-800 text-white px-3 py-2 flex items-center justify-between gap-2 flex-wrap text-xs">
          <span id="worksheet-title" class="font-medium truncate max-w-[40%]">worksheet.pdf</span>
          <div class="flex items-center gap-2">
            <button id="zoom-out" type="button" class="btn-key btn-key-sm btn-key-cream" aria-label="Zoom out">&minus;</button>
            <span id="page-count" class="tabular-nums">Page 1 of 1</span>
            <button id="zoom-in" type="button" class="btn-key btn-key-sm btn-key-cream" aria-label="Zoom in">+</button>
          </div>
          <div class="flex items-center gap-2">
            <button id="print-btn" type="button" class="btn-key btn-key-sm btn-key-teal">Print</button>
            <button id="download-btn" type="button" class="btn-key btn-key-sm btn-key-primary">Download</button>
          </div>
        </div>
        <div id="viewer-scroll" class="overflow-auto max-h-[75vh] p-4 bg-[#dde1e6]">
          <div id="pages-container"></div>
        </div>
      </div>

      <!-- SIDEBAR AD -->
      <!-- Sidebar rectangle ad slot (AdSense unit: Rectangle - sidebar). -->
      <div id="ad-slot-sidebar" class="order-2 md:order-3 w-full md:w-[300px] h-[250px] overflow-hidden mx-auto">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-6130154285914649"
             data-ad-slot="8894500230"
             data-ad-format="rectangle"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

    </div>

    <!-- Leaderboard ad slot (AdSense unit: Leaderboard - top), moved below the
         viewer so it never sits between the page load and the worksheet the
         visitor actually came here for. -->
    <div id="ad-slot-bottom-leaderboard" class="w-full h-[90px] overflow-hidden mt-6 mx-auto max-w-3xl">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-6130154285914649"
           data-ad-slot="7285905093"
           data-ad-format="horizontal"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>
</main>

<footer class="border-t-2 border-stone-800 bg-[#eef0f3] mt-8">
  <div class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-stone-500">
    Ys Learning Lab worksheet generators. PDFs are generated entirely client-side in your browser.
  </div>
</footer>

<!-- Hidden iframe purely to drive native browser PDF printing (more reliable than printing the on-screen canvases). -->
<iframe id="print-frame" class="hidden" title="Print"></iframe>

<script src="js/pdf-common.js?v=17"></script>
<script type="module" src="js/pdf-viewer.js?v=17"></script>
</body>
</html>
